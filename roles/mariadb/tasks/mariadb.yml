---

- name: Packages
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Create databases
  community.mysql.mysql_db:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ item.key }}"
    state: present
  loop: "{{ mariadb.databases | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create users
  community.mysql.mysql_user:
    column_case_sensitive: true
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: "{{ item.key }}"
    password: "{{ item.value.password }}"
    # yamllint disable-line rule:line-length
    priv: "{% for k, v in item.value.grants.items() %}{{ k }}:{{ v }}{% if not loop.last %}/{% endif %}{% endfor %}"
    state: present
  loop: "{{ mariadb.users | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
