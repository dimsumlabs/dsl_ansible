---

dehydrated:

mariadb:
  databases:
    test1:
  users:
    test1user:
      passpath: mariadb/test1user
      grants:
        test1.*: ALL

nftables:
  monitoring_ports:
    tcp:
      - 4040
      - 4949
      - 9100
  ports:
    tcp:
      - 80
      - 443
  template_type: simple_server

nginx:
  vhosts:
    dimsumlabs.com:
      template_type: generic
      locations:
        /:
          location_type: return
          return: 301 https://www.dimsumlabs.com$request_uri
    hargow.dimsumlabs.com:
      template_type: wordpress
      root: /srv/test1/wordpress

wordpress:
  test1:
    version: 6.7.7
    db_user: test1user
    db_passpath: mariadb/test1user
    salts_passpath: wordpress/test1salts
