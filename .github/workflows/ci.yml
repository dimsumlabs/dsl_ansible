---

name: CI

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linttest:
    name: make lint test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          make build_dep

      - name: Run tests and linters
        run: |
          make -k lint test
